[package]
name = "neuroprix-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NeuroPrix's race engine in Rust: the same results as neuroprix.engine, step by step, several times faster"
repository = "https://github.com/NeuroPrix/neuroprix-sdk"
publish = false

[lib]
name = "neuroprix_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
