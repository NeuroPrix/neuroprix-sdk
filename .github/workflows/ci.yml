# Tests on every push and pull request: every supported Python on Linux, plus macOS and Windows, then the built
# package (wheel and sdist) installed into a clean environment and tested from outside the source folder.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: CPU-only PyTorch (Linux, Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -v --durations=10

  package:
    name: build and test the package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[test]"
          mkdir /tmp/wheel-test && cp -r tests examples pyproject.toml /tmp/wheel-test/
          cd /tmp/wheel-test && /tmp/wheel-env/bin/neuroprix-runner --version && /tmp/wheel-env/bin/python -m pytest -q
      - name: Test the sdist in a clean environment
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/sdist-env/bin/pip install "$(ls dist/*.tar.gz)" pytest
          mkdir /tmp/sdist-test && tar xzf dist/*.tar.gz -C /tmp/sdist-test --strip-components=1
          cd /tmp/sdist-test && rm -rf neuroprix && /tmp/sdist-env/bin/python -m pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t neuroprix-runner .
      - run: docker run --rm neuroprix-runner --version
