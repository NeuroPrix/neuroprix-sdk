# The optional Rust engine (neuroprix-engine/): ready-built wheels for Linux, macOS and Windows (one per platform: they
# work on every Python from 3.10), each tested against the Python engine step by step on Pythons 3.10 to 3.14 (math.hypot
# and sum() changed in 3.12, so both sides of that are tested). A tag engine-v0.1.0 publishes them to PyPI after the
# tests pass. One-time setup on pypi.org: add this repository as a "trusted publisher" for the neuroprix-engine project
# (workflow engine-wheels.yml, environment "pypi-engine"). No PyPI password or token is stored in the repository.
name: Rust engine

on:
  push:
    branches: ["**"]
    tags: ["engine-v*"]   # (path filters don't apply to tags: a tag always runs)
    paths: ["neuroprix-engine/**", "neuroprix/**", "tests/**", ".github/workflows/engine-wheels.yml"]
  pull_request:
    paths: ["neuroprix-engine/**", "neuroprix/**", "tests/**", ".github/workflows/engine-wheels.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path neuroprix-engine/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path neuroprix-engine/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    name: same as Python (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.11", wheel: wheel-macos-latest-aarch64 }
          - { os: macos-latest, python: "3.14", wheel: wheel-macos-latest-aarch64 }
          - { os: windows-latest, python: "3.11", wheel: wheel-windows-latest-x64 }
          - { os: windows-latest, python: "3.14", wheel: wheel-windows-latest-x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.wheel || 'wheel-ubuntu-latest-x86_64' }}
          path: wheel/
      - name: CPU-only PyTorch (Linux, Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the SDK and the Rust engine
        shell: bash
        run: python -m pip install -e ".[test]" wheel/*.whl
      - name: The Rust engine gives exactly the Python engine's results
        run: python -m pytest -v tests/test_engines.py
      - name: The trainer and the runner on the Rust engine
        env:
          NEUROPRIX_TRAIN_ENGINE: rust
        run: python -m pytest -q tests/test_trainer.py tests/test_runner.py

  publish:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
